name: CI

on:
  push:
  pull_request:

jobs:
  self-checks:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every module
        run: python -m compileall -q .
      - name: Core self-check (parameter engine, context budgeting, reply protocol, templates)
        run: python core.py
      - name: Connector self-check
        run: python apps.py
